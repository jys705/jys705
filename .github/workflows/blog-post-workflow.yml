name: Latest blog post workflow

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://itcase.tistory.com/rss"
          max_post_count: 5
          date_format: "mmm d, yyyy"
          # 티스토리는 Accept: application/rss+xml 요청을 406으로 거부함
          accept_header: "*/*"
          retry_count: 3
          retry_wait_time: 5
          # 티스토리 RSS가 제목의 &를 이중 인코딩(&amp;amp;)해서 내려보내는 버그 보정
          # Security/News 카테고리 글은 목록에서 제외
          item_exec: |
            post.title = post.title.replace(/&amp;/g, '&');
            if (post.categories.includes('Security/News')) { post = null; }
